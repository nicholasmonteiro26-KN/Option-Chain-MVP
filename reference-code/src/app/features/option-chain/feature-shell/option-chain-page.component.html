<main class="page" aria-label="Option chain">
  <h1 class="sr">Option chain</h1>
  <oc-underlying-bar
    [quick]="quick()"
    [selected]="selected()"
    [quickPrices]="quickPrices()"
    [ohlc]="ohlc()"
    [lotSize]="lotSize()"
    [ltp]="store.spot()"
    [searchResults]="searchResults()"
    [resultsFor]="resultsFor()"
    (select)="onSelectUnderlying($event)"
    (search)="onSearch($event)"
  >
    <!-- Page tools sit at the right of the search box (no separate title row). -->
    <oc-theme-toggle />
  </oc-underlying-bar>

  <oc-view-toolbar
    [presetId]="presetId()"
    [customEditorOpen]="showEditor()"
    [strikeCount]="prefs().strikeCount"
    [notice]="notice()"
    (presetChange)="onPreset($event)"
    (editColumns)="editorOpen.set(true)"
    (strikeCountChange)="onStrikeCount($event)"
    (exportCsv)="onCsv()"
  />

  @if (stripSelected(); as sel) {
    <oc-expiry-strip
      [expiries]="store.expiries()"
      [selected]="sel"
      [nowMs]="nowMs()"
      [stats]="stats()"
      [feedStatus]="store.feedStatus()"
      [partial]="store.partialChain()"
      (expiryChange)="onExpiry($event)"
    />
  }

  <oc-status-banner [kind]="alertKind()" [sym]="selected().sym" (retry)="retry()" />

  @if (showEditor()) {
    <oc-column-chooser
      data-testid="custom-editor"
      [columns]="customView().columns"
      [presets]="prefs().customPresets"
      [mode]="customView().mode"
      (columnsChange)="onCustomColumns($event)"
      (modeChange)="onCustomMode($event)"
      (savePreset)="onSavePreset($event)"
      (renamePreset)="onRenamePreset($event)"
      (deletePreset)="onDeletePreset($event)"
      (applyPreset)="onApplyPreset($event)"
      (done)="editorOpen.set(false)"
    />
  }

  <oc-chain-table
    [vm]="tableVm()"
    [spot]="store.spot() ?? 0"
    [checked]="checked()"
    [stale]="stale()"
    [loading]="tableLoading()"
    (trade)="onTrade($event)"
    (toggleCheck)="onToggleCheck($event)"
    (contractAction)="onContractAction($event)"
  />

  <!-- The strategy pop-up floats just above the footer (after it in the DOM, so Tab goes from its button into it). -->
  <div class="foot">
    <oc-footer-actions
      [checkedCount]="checked().size"
      [strategyOpen]="strategyOpen()"
      (addToWatchlist)="onAddToWatchlist()"
      (addToBasket)="onAddToBasket()"
      (buildStrategy)="onBuildStrategy()"
    />
    @if (strategyOpen()) {
      <oc-strategy-panel
        class="strategy"
        [sym]="selected().sym"
        [strategy]="strategy.current()"
        [live]="store.legPrices()"
        [margin]="margin.state()"
        [expiries]="store.expiries()"
        [pickerFor]="pickerFor()"
        [marketOpen]="session.isOpen()"
        [placing]="placing()"
        (edit)="strategy.update($event.id, $event.edit)"
        (remove)="strategy.remove($event)"
        (clearAll)="strategy.clear()"
        (swap)="onSwap($event)"
        (lotMultiplier)="strategy.setLotMultiplier($event)"
        (product)="strategy.setProduct($event)"
        (resetPrices)="strategy.resetPrices(store.legPrices())"
        (retryMargin)="margin.retry()"
        (saveToBasket)="onSaveToBasket()"
        (execute)="onExecute()"
        (collapse)="onCollapseStrategy()"
      />
    }
  </div>
</main>

@if (statusLine(); as line) {
  <p class="toast" role="status" data-testid="status-line">{{ line }}</p>
}
